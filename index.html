<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOPUPGRAM - Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 pb-10">

    <header class="bg-white border-b border-pink-100 p-4 sticky top-0 z-10 flex items-center justify-between">
        <span class="font-black text-xl text-pink-600">TOPUPGRAM</span>
        <span class="text-xs font-bold bg-pink-100 text-pink-700 px-3 py-1 rounded-full">Mini App</span>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <section class="bg-gradient-to-r from-pink-500 to-rose-400 text-white p-5 rounded-2xl shadow-md text-center space-y-1">
            <h2 class="font-extrabold text-base">YOUR BEST TOPUP PARTNER</h2>
            <p class="text-xs text-pink-100">Pilih game favoritmu dan salin format order dengan sekali klik!</p>
        </section>

        <!-- GAME TERATAS -->
        <section class="space-y-3">
            <h3 class="font-extrabold text-slate-800 text-sm">GAME TERATAS</h3>
            <div class="grid grid-cols-3 gap-3">
                <a href="./pages/robux-vlog.html" class="bg-white border border-pink-100 p-3 rounded-2xl text-center hover:border-pink-400 transition block">
                    <div class="bg-pink-50 text-pink-500 w-10 h-10 mx-auto rounded-xl flex items-center justify-center mb-2">
                        <i data-lucide="box"></i>
                    </div>
                    <div class="text-[10px] bg-pink-100 text-pink-700 font-bold rounded-full py-0.5">V-Log</div>
                    <div class="text-xs font-bold mt-1">Roblox</div>
                </a>

                <a href="./pages/robux-vsend.html" class="bg-white border border-pink-100 p-3 rounded-2xl text-center hover:border-pink-400 transition block">
                    <div class="bg-pink-50 text-pink-500 w-10 h-10 mx-auto rounded-xl flex items-center justify-center mb-2">
                        <i data-lucide="send"></i>
                    </div>
                    <div class="text-[10px] bg-pink-100 text-pink-700 font-bold rounded-full py-0.5">V-Sen</div>
                    <div class="text-xs font-bold mt-1">Roblox</div>
                </a>

                <a href="./pages/heartopia.html" class="bg-white border border-pink-100 p-3 rounded-2xl text-center hover:border-pink-400 transition block">
                    <div class="bg-pink-50 text-pink-500 w-10 h-10 mx-auto rounded-xl flex items-center justify-center mb-2">
                        <i data-lucide="heart"></i>
                    </div>
                    <div class="text-[10px] bg-pink-100 text-pink-700 font-bold rounded-full py-0.5">V-Log</div>
                    <div class="text-xs font-bold mt-1">Heartopia</div>
                </a>
            </div>
        </section>

        <!-- TOPUP VIA LOGIN -->
        <section class="space-y-3">
            <h3 class="font-extrabold text-slate-800 text-sm">TOPUP VIA LOGIN</h3>
            <div class="grid grid-cols-2 gap-3">
                <a href="./pages/genshin.html" class="bg-white p-3 border border-slate-100 rounded-2xl flex items-center gap-3 hover:border-pink-300 transition block">
                    <div class="w-8 h-8 bg-purple-50 text-purple-500 rounded-lg flex items-center justify-center">
                        <i data-lucide="sparkles" class="w-4 h-4"></i>
                    </div>
                    <span class="text-xs font-bold">Genshin Impact</span>
                </a>
            </div>
        </section>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });
    </script>
</body>
</html>
