<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOPUPGRAM - Mini App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Proteksi Anti Long-Press / Tekan Lama */
        * {
            -webkit-touch-callout: none !important; /* Matikan popup menu di iOS/Android */
            -webkit-user-select: none !important;   /* Matikan seleksi teks */
            user-select: none !important;
        }
        
        /* Efek Tap Bergetar Halus */
        .card-btn {
            transition: transform 0.1s ease, filter 0.15s ease;
        }
        .card-btn:active {
            transform: scale(0.95);
            filter: brightness(0.9);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-12 font-sans select-none">

    <!-- Header -->
    <header class="bg-white border-b border-pink-100 p-4 sticky top-0 z-10 flex items-center justify-between shadow-sm">
        <span class="font-black text-xl text-pink-600 tracking-tight">TOPUPGRAM</span>
        <span class="text-[10px] font-extrabold bg-pink-100 text-pink-700 px-3 py-1 rounded-full uppercase tracking-wider">Mini App</span>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Banner Top -->
        <section class="bg-gradient-to-r from-pink-500 via-rose-400 to-pink-400 text-white p-5 rounded-2xl shadow-md text-center space-y-1">
            <h2 class="font-black text-base tracking-wide">YOUR BEST TOPUP PARTNER</h2>
            <p class="text-xs text-pink-100 font-medium">Pilih game favoritmu dan salin format order dengan sekali klik!</p>
        </section>

        <!-- GAME TERATAS -->
        <section class="space-y-3">
            <h3 class="font-extrabold text-slate-800 text-sm flex items-center gap-2">
                <span class="w-2 h-4 bg-pink-500 rounded-full inline-block"></span>
                GAME TERATAS
            </h3>
            
            <div class="grid grid-cols-3 gap-3">

                <!-- 1. Robux Via Login -->
                <div onclick="navigateTo('./pages/robux-vlog.html')" class="card-btn relative h-36 rounded-2xl overflow-hidden border border-pink-100 shadow-sm cursor-pointer flex flex-col justify-end p-2.5 bg-cover bg-center" 
                     style="background-image: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0.1)), url('https://faqs.uwu.ai/assets/images/gallery05/aa7a759c_original.jpg?v=15845db8');">
                    <span class="bg-pink-500/90 text-white font-extrabold text-[9px] px-2 py-0.5 rounded-full w-max mb-1 backdrop-blur-xs">Via Login</span>
                    <span class="text-xs font-black text-white leading-tight">Roblox</span>
                </div>

                <!-- 2. Robux VISEND -->
                <div onclick="navigateTo('./pages/robux-vsend.html')" class="card-btn relative h-36 rounded-2xl overflow-hidden border border-pink-100 shadow-sm cursor-pointer flex flex-col justify-end p-2.5 bg-cover bg-center" 
                     style="background-image: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0.1)), url('https://faqs.uwu.ai/assets/images/gallery05/83da53bf_original.jpg?v=15845db8');">
                    <span class="bg-rose-500/90 text-white font-extrabold text-[9px] px-2 py-0.5 rounded-full w-max mb-1 backdrop-blur-xs">VISEND</span>
                    <span class="text-xs font-black text-white leading-tight">Roblox</span>
                </div>

                <!-- 3. Heartopia Via Login -->
                <div onclick="navigateTo('./pages/heartopia.html')" class="card-btn relative h-36 rounded-2xl overflow-hidden border border-pink-100 shadow-sm cursor-pointer flex flex-col justify-end p-2.5 bg-cover bg-center" 
                     style="background-image: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0.1)), url('https://faqs.uwu.ai/assets/images/gallery05/781a7dda_original.jpg?v=15845db8');">
                    <span class="bg-pink-500/90 text-white font-extrabold text-[9px] px-2 py-0.5 rounded-full w-max mb-1 backdrop-blur-xs">Via Login</span>
                    <span class="text-xs font-black text-white leading-tight">Heartopia</span>
                </div>

            </div>
        </section>

        <!-- TOPUP VIA LOGIN -->
        <section class="space-y-3">
            <h3 class="font-extrabold text-slate-800 text-sm flex items-center gap-2">
                <span class="w-2 h-4 bg-pink-500 rounded-full inline-block"></span>
                TOPUP VIA LOGIN
            </h3>

            <div class="grid grid-cols-2 gap-3">

                <!-- Genshin Impact -->
                <div onclick="navigateTo('./pages/genshin.html')" class="card-btn relative h-24 rounded-2xl overflow-hidden border border-slate-100 shadow-sm cursor-pointer flex flex-col justify-end p-3 bg-cover bg-center"
                     style="background-image: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.1)), url('https://faqs.uwu.ai/assets/images/gallery05/e0f75191_original.jpg?v=15845db8');">
                    <span class="text-xs font-black text-white">Genshin Impact</span>
                    <span class="text-[9px] text-pink-200 font-semibold">Via Login</span>
                </div>

                <!-- Honkai Star Rail (HSR) -->
                <div onclick="navigateTo('./pages/hsr.html')" class="card-btn relative h-24 rounded-2xl overflow-hidden border border-slate-100 shadow-sm cursor-pointer flex flex-col justify-end p-3 bg-cover bg-center"
                     style="background-image: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.1)), url('https://faqs.uwu.ai/assets/images/gallery05/a9249633_original.jpg?v=15845db8');">
                    <span class="text-xs font-black text-white">Honkai: Star Rail</span>
                    <span class="text-[9px] text-pink-200 font-semibold">Via Login</span>
                </div>

                <!-- NTE (Neverness to Everness) -->
                <div onclick="navigateTo('./pages/nte.html')" class="card-btn relative h-24 rounded-2xl overflow-hidden border border-slate-100 shadow-sm cursor-pointer flex flex-col justify-end p-3 bg-cover bg-center"
                     style="background-image: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.1)), url('https://faqs.uwu.ai/assets/images/gallery05/0cbdfa8c_original.jpg?v=15845db8');">
                    <span class="text-xs font-black text-white">NTE</span>
                    <span class="text-[9px] text-pink-200 font-semibold">Via Login</span>
                </div>

            </div>
        </section>

    </main>

    <script>
        // Fungsi Pindah Halaman Tanpa Link <a> (Mencegah Long-Press Menu)
        function navigateTo(url) {
            window.location.href = url;
        }

        // Matikan Klik Kanan di HP & Browser
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
